# 17.yml (.github/workflows/17.yml) - works through your list in card-data (data/cardladder/pic_certs/
# card_ladder_cert.csv), the same way 15.yml does your scans.
#
# It fetches only that one file, opens each link through your Decodo ISP plan in a browser with your extension loaded,
# and saves each read to the cardladder/ folder of your inbox repo as soon as it's read. Each read is also copied to
# cardladder/ in scan-results, whose history is kept at one entry with no message, so that repo shows the reads and
# nothing else. The list is worked through from the top; links you add to it later are opened too.
#
# Four of GitHub's machines work on the list side by side, each with 4 browsers, its own share of the links and its own
# group of addresses (ports 10006-10050 of the ISP plan, about 11 each). Every link is in exactly one share, so nothing
# is opened twice. When the site turns an address away, that address rests and another of the machine's takes over.
#
# Adding links is what starts it: while a run is open it checks the list every 30 seconds, and every 5 minutes a check
# starts a run if new links have come in. A run stops after 5 hours and starts the next one itself while links are
# left; once the list is done, it stays open 2 hours for more. (While a run is open, the 5-minute checks wait behind it
# and show as "cancelled" on the Actions tab: that's normal.)
#
# Your scans come first: the scan run (15.yml) keeps ports 10001-10005 to itself, so this list never slows a scan down.
#
# A link is opened once, ever (clearing the list doesn't start it over). Progress is kept in this repo as 18.csv,
# scrambled - each link is a code that can't be turned back into the link without SCAN_SCRAMBLE_KEY. Each machine merges
# its progress into it every 10 minutes and at the end, so they never overwrite each other. The logs (and the reports on
# the "List opener reports" issue, one per machine) only show row numbers and counts.
#
# Secrets: the same ones as 15.yml, nothing new (CARD_READ_KEY, CARD_INBOX_KEY, SCAN_RESULTS_KEY, DECODO_PASSWORD,
# SCAN_SCRAMBLE_KEY).

name: List opener

on:
  workflow_dispatch: # "Run workflow" on the Actions tab, and the next run after 5 hours
  schedule:
    - cron: "3-59/5 * * * *" # every 5 minutes: a run starts if new links have come in

concurrency:
  group: list-opener
  cancel-in-progress: false # a check waits for the run that's open (which picks up new links by itself anyway)

permissions:
  contents: write # save 18.csv
  actions: write # start the next run
  issues: write # post the report

env:
  BROWSERS: "4" # browsers at once, each on its own address
  LIMIT: "0" # no limit per run
  RUN_MINUTES: "300" # a run stops after this long (GitHub's limit is 6 hours); the next one carries on
  KEEP_GOING: "true" # start the next run straight away if links are left
  WATCH_MINUTES: "120" # stay open this long after the last link, checking for new ones
  WATCH_EVERY: "30" # seconds between checks
  RESTART_ON_CLEAR: "false" # each link is opened once, ever
  NEWEST_FIRST: "false" # from the top of the list down; links added later go after the rest
  SITE_GAPS: "5:180,3:60,2:20" # if pages come back empty, slow down on that site (as for links.csv)
  FAST_SAVE: "true" # save the reads as they come in...
  BATCH: "1"
  SAVE_EVERY_SECONDS: "30" # ...at most every 30 seconds per machine, so the four don't keep saving over each other
  PAUSE_SECONDS: "3-8" # wait between pages, in seconds
  READ_WAIT_SECONDS: "25"
  SETTLE_SECONDS: "5"
  LIGHT: "true" # skip pictures, fonts, video and trackers
  USE_PROXY: "true"
  PROXY_HOST: "isp.decodo.com" # Decodo's ISP plan: 50 fixed addresses, one per port (the ports are set per machine below)
  PROXY_USER: "spdtx2m9da"
  SCANS_REPO: "driftcodedev/card-data"
  SCANS_FILE: "data/cardladder/pic_certs/card_ladder_cert.csv" # the only file taken from card-data
  EXTENSION_REPO: "driftcodedev/results-links"
  EXTENSION_FOLDER: "cert-reader" # the only folder taken from results-links
  INBOX_REPO: "driftcodedev/card-inbox"
  INBOX_FOLDER: "cardladder" # these reads go here
  SHARE_REPO: "driftcodedev/scan-results" # and a copy of each one here, history kept at one entry
  SHARE_FOLDER: "cardladder"
  LINKS_FILE: "list.csv"
  LINK_COLUMN: "0"
  REPO_DIR: work
  STATUS_FILE: ${{ github.workspace }}/progress.csv # this machine's progress
  SHARED_STATUS: ${{ github.workspace }}/code/18.csv # everyone's, merged
  PARTS: "4"

jobs:
  open:
    name: "Open the list (part ${{ matrix.part }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false # one machine having a problem doesn't stop the others
      matrix:
        include: # each machine's share of the list and its own addresses (the scan run keeps 10001-10005)
          - part: 1
            ports: "10006-10016"
          - part: 2
            ports: "10017-10027"
          - part: 3
            ports: "10028-10038"
          - part: 4
            ports: "10039-10050"
    env:
      PART: ${{ matrix.part }}
      PROXY_PORTS: ${{ matrix.ports }}
    steps:
      - name: Get the code and the progress
        uses: actions/checkout@v4
        with:
          path: code
      - name: Get the list (only that file)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SCANS_REPO }}
          ref: main
          token: ${{ secrets.CARD_READ_KEY }}
          path: scans-src
          filter: blob:none
          sparse-checkout: ${{ env.SCANS_FILE }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plan
        id: plan
        env:
          LINK_KEY: ${{ secrets.SCAN_SCRAMBLE_KEY }}
        run: |
          if [ -z "$LINK_KEY" ]; then
            echo "The SCAN_SCRAMBLE_KEY secret isn't set, so progress can't be kept without the links showing. Add it and run again."
            exit 1
          fi
          mkdir -p work
          if [ -f "scans-src/$SCANS_FILE" ]; then cp "scans-src/$SCANS_FILE" "work/$LINKS_FILE"; fi
          python code/11.py plan
      - name: Get your extension (only its folder)
        if: steps.plan.outputs.work == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.EXTENSION_REPO }}
          token: ${{ secrets.CARD_READ_KEY }}
          path: ext-src
          filter: blob:none
          sparse-checkout: ${{ env.EXTENSION_FOLDER }}
          persist-credentials: false
      - name: Put the extension in place
        if: steps.plan.outputs.work == 'true'
        run: cp -r "ext-src/$EXTENSION_FOLDER" "work/$EXTENSION_FOLDER"
      - name: Keep the browser between runs
        if: steps.plan.outputs.work == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/pip
          key: scan-browser-${{ runner.os }}-scrapling-0.5-v1
      - name: Install Scrapling and the browser
        id: install
        if: steps.plan.outputs.work == 'true'
        run: |
          set -o pipefail
          {
            python -m pip install -q "scrapling[fetchers]==0.5"
            python -m patchright install --with-deps chromium > /dev/null
            command -v xvfb-run > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)
          } 2>&1 | tee "$RUNNER_TEMP/install.log"
      - name: Open the links
        id: open
        if: steps.plan.outputs.work == 'true'
        env:
          LINK_KEY: ${{ secrets.SCAN_SCRAMBLE_KEY }}
          DECODO_PASSWORD: ${{ secrets.DECODO_PASSWORD }}
          CARD_INBOX_KEY: ${{ secrets.CARD_INBOX_KEY }}
          KEY_WHERE: "the CARD_INBOX_KEY secret in scrap"
          SHARE_KEY: ${{ secrets.SCAN_RESULTS_KEY }}
          SHARE_KEY_WHERE: "the SCAN_RESULTS_KEY secret in scrap"
          # how the run checks for new links while it's open: the latest copy of the list, that file only
          REFRESH_LINKS: >-
            git -C scans-src fetch -q --depth 1 origin main &&
            git -C scans-src reset -q --hard FETCH_HEAD &&
            cp "scans-src/$SCANS_FILE" "work/$LINKS_FILE"
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" python code/11.py open 2>&1 | tee "$RUNNER_TEMP/opener.log"
      - name: Save progress (scrambled)
        id: save
        if: always() && steps.plan.outputs.work == 'true'
        env:
          LINK_KEY: ${{ secrets.SCAN_SCRAMBLE_KEY }}
        run: python code/11.py save # merges this machine's progress into 18.csv (it saves as it goes, too)
      - name: Start the next run
        if: steps.open.outputs.more == 'true' && env.KEEP_GOING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run 17.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          echo "Links are left, so the next run is queued."
      - name: Report
        if: always() && (steps.plan.outputs.work == 'true' || failure())
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          STEPS: "plan: ${{ steps.plan.outcome }}, install: ${{ steps.install.outcome }}, open: ${{ steps.open.outcome }}, save progress: ${{ steps.save.outcome }}"
        run: |
          report="$RUNNER_TEMP/report.md"
          {
            echo "### List run $GITHUB_RUN_NUMBER, part $PART: $RESULT ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            echo "Steps - $STEPS"
            if [ -s "$RUNNER_TEMP/opener.log" ]; then
              echo; echo "Log (last 40 lines; row numbers and counts only):"; echo '```'
              grep -v "WARNING" "$RUNNER_TEMP/opener.log" | tail -n 40; echo '```'
            fi
            if [ "${{ steps.install.outcome }}" = "failure" ] && [ -s "$RUNNER_TEMP/install.log" ]; then
              echo; echo "Install log (last 20 lines):"; echo '```'; tail -n 20 "$RUNNER_TEMP/install.log"; echo '```'
            fi
          } > "$report"
          title="List opener reports"
          # (by listing the open issues, not GitHub's search, which can lag behind - after the account rename it
          # found nothing and each report opened a new issue; the oldest one with this title is used)
          issue=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 200 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | sort -n | head -n 1)
          if [ -z "$issue" ]; then
            issue=$(gh issue create -R "$GITHUB_REPOSITORY" --title "$title" \
              --body "Each run adds a comment here: counts, step results and stop reasons only." | grep -o '[0-9]*$')
          fi
          gh issue comment "$issue" -R "$GITHUB_REPOSITORY" --body-file "$report" > /dev/null && echo "Report posted."
